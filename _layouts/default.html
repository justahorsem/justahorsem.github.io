<!DOCTYPE html>
<html>
  {% include head.html %}
  <body>
    {% include nav.html %}

    {% if page.toc==true %}
      <aside class="toc">
        {% include toc.html html=content %}
      </aside>
    {% endif %}

    <div id="main" role="main" class="wrapper-content">
      <div class="container">
        {{ content }}
      </div>
    </div>

    {% include analytics.html %}

    <!-- Mermaid JS Support -->
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
      mermaid.initialize({ startOnLoad: false, theme: 'default' });
      document.addEventListener("DOMContentLoaded", function() {
        let hasMermaid = false;
        let blocks = document.querySelectorAll(".language-mermaid code, code.language-mermaid");
        blocks.forEach(function(code) {
          hasMermaid = true;
          let wrapper = code.closest('.language-mermaid') || code.closest('pre') || code;
          let div = document.createElement("div");
          div.className = "mermaid";
          div.style.textAlign = 'center';
          div.textContent = code.textContent;
          wrapper.parentElement.replaceChild(div, wrapper);
        });
        if (hasMermaid) {
          mermaid.run({ querySelector: '.mermaid' });
        }
      });
    </script>
  </body>

  {% if page.toc==true %}
  <script>
    document.getElementById("main").classList.add("withtoc");
  </script>
  {% endif %}

  <div class="wrapper-footer-mobile">
    <footer class="footer">
      {% include footer.html %}
    </footer>
  </div>
  {% include theme-toggle.html %}

</html>
